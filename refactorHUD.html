  <div class="hud-canvas" :class="{ 'light-theme': !isDarkMode, 'server-offline': !isServerConnected }">
    <div class="ambient-mesh" :class="{ 'light-active': isLightOn && isServerConnected }"></div>

    <Transition name="toast-slide">
      <div v-if="toast.visible" class="hud-toast" :class="toast.type">
        <div class="toast-icon">
          <svg v-if="toast.icon === 'connect'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" stroke-linecap="round"/><polyline points="22 4 12 14.01 9 11.01" stroke-linecap="round" stroke-linejoin="round"/>

          <div class="led-indicator" :class="{ 'led-on': isServerConnected }"></div>

      <div class="interaction-wrapper" :class="{ 'is-disabled': !isServerConnected }">

                :class="{ 'crater-active': isLightOn && isServerConnected }"
                @click="toggleLight">

            </div>

<script setup>
import { ref } from 'vue'

const isServerConnected = ref(true)
const isLightOn = ref(false)
const isDarkMode = ref(true)

// --- 弹窗 Toast 系统 ---
const toast = ref({ visible: false, message: '', type: 'default', icon: '' })
let toastTimer = null

const showToast = (message, type = 'default', icon = '') => {
  toast.value = { visible: true, message, type, icon }
  if (toastTimer) clearTimeout(toastTimer)
  toastTimer = setTimeout(() => {
    toast.value.visible = false
  }, 2500)
}

// --- 交互逻辑 ---
const toggleTheme = () => {
  isDarkMode.value = !isDarkMode.value
}

const toggleServer = () => {
  isServerConnected.value = !isServerConnected.value
  
  if (isServerConnected.value) {
    showToast('已与 NodeMCU 建立安全连接', 'success', 'connect')
  } else {
    isLightOn.value = false
    showToast('失去服务器连接，系统已离线', 'error', 'disconnect')
  }
}

const toggleLight = () => {
  if (!isServerConnected.value) {
    showToast('无法控制：请先连接远程服务器', 'warning', 'warning')
    return
  }

  isLightOn.value = !isLightOn.value
  
  if (isLightOn.value) {
    showToast('指令已发送：灯光开启', 'success', 'light-on')
  } else {
    showToast('指令已发送：灯光进入待机', 'default', 'light-off')
  }
  
  console.log(`Command: ${isLightOn.value ? 'HIGH' : 'LOW'}`)
}
</script>
